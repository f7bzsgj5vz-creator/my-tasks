<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Tasks">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">

<title>My Tasks</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f5f6fa;--card:#fff;--text:#202124;--muted:#7b7f87;--primary:#6366f1;--line:#e7e8ee}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
.container{width:min(680px,100%);min-height:100vh;margin:auto;padding:calc(22px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
h1{margin:0;font-size:30px;letter-spacing:-.5px}
.progress{font-size:13px;color:var(--muted);background:#fff;padding:8px 11px;border-radius:999px;box-shadow:0 2px 10px #0000000a}
.input-area{background:var(--card);padding:14px;border-radius:20px;box-shadow:0 5px 22px #0000000a;margin-bottom:18px}
.input-row{display:flex;gap:9px}
input,select,button{font:inherit}
#taskInput{flex:1;min-width:0;padding:14px;border:1px solid var(--line);border-radius:14px;outline:none;background:#fafbfc}
#taskInput:focus{border-color:var(--primary);box-shadow:0 0 0 3px #6366f11c}
#addButton{border:0;background:var(--primary);color:white;padding:0 18px;border-radius:14px;font-weight:700;cursor:pointer}
#addButton:active{transform:scale(.97)}
.options{display:flex;gap:8px;margin-top:10px}
.options select,.options input{flex:1;min-width:0;padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#444}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.filters{display:flex;gap:5px;background:#e9eaf0;padding:4px;border-radius:12px}
.filter{border:0;background:transparent;padding:7px 10px;border-radius:9px;cursor:pointer;color:#666}
.filter.active{background:#fff;color:#333;box-shadow:0 2px 7px #0000000b;font-weight:700}
#taskList{display:flex;flex-direction:column;gap:9px}
.tools{display:flex;gap:7px;width:100%}
#searchInput,#sortSelect{padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#444;outline:none}
#searchInput{flex:1;min-width:0}
#sortSelect{width:145px}
#searchInput:focus,#sortSelect:focus{border-color:var(--primary)}
.task{background:var(--card);padding:14px;border-radius:17px;display:flex;align-items:center;gap:11px;box-shadow:0 3px 13px #00000008}
.task.completed{opacity:.55}
.task.completed .task-title{text-decoration:line-through}
.check{width:22px;height:22px;cursor:pointer;accent-color:var(--primary);flex:none}
.task-content{flex:1;min-width:0}
.task-title{font-weight:650;word-break:break-word}
.task-meta{display:flex;gap:7px;align-items:center;margin-top:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.priority{padding:3px 7px;border-radius:7px;font-weight:700}
.high{background:#fee2e2;color:#dc2626}.medium{background:#fef3c7;color:#d97706}.low{background:#dcfce7;color:#16a34a}
.delete{border:0;background:#f4f4f6;color:#999;font-size:19px;width:34px;height:34px;border-radius:10px;cursor:pointer}
.delete:active{transform:scale(.94)}
.empty{text-align:center;color:#999;padding:46px 0}
@media(max-width:520px){
 .container{padding-left:13px;padding-right:13px}
 .input-row{gap:7px}
 #addButton{width:74px;padding:0}
 .toolbar{align-items:stretch;gap:10px;flex-direction:column}
 .filter{padding:7px 12px}
 .tools{width:100%}
 #sortSelect{width:135px}
}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>My Tasks</h1>
    <span class="progress" id="taskCount">0件</span>
  </div>

  <div class="input-area">
    <div class="input-row">
      <input id="taskInput" type="text" placeholder="新しいタスクを入力…" maxlength="100">
      <button id="addButton">追加</button>
    </div>
    <div class="options">
      <select id="priority">
        <option value="medium">中優先</option>
        <option value="high">高優先</option>
        <option value="low">低優先</option>
      </select>
      <input id="dueDate" type="date">
    </div>
  </div>

  <div class="toolbar">
    <div class="filters">
      <button class="filter active" data-filter="all">すべて</button>
      <button class="filter" data-filter="active">未完了</button>
      <button class="filter" data-filter="completed">完了</button>
    </div>
    <div class="tools">
      <input id="searchInput" type="search" placeholder="🔍 タスクを検索…">
      <select id="sortSelect" aria-label="並び替え">
        <option value="newest">新しい順</option>
        <option value="oldest">古い順</option>
        <option value="due">期限が近い順</option>
        <option value="priority">優先度順</option>
      </select>
    </div>
  </div>

  <div id="taskList"></div>
</div>

<script>
const taskInput=document.getElementById("taskInput");
const addButton=document.getElementById("addButton");
const priorityInput=document.getElementById("priority");
const dueDateInput=document.getElementById("dueDate");
const taskList=document.getElementById("taskList");
const taskCount=document.getElementById("taskCount");
let tasks=JSON.parse(localStorage.getItem("myTasks")||"[]");
let currentFilter="all";
let searchText="";
let sortMode="newest";
let editingId=null;

function saveTasks(){localStorage.setItem("myTasks",JSON.stringify(tasks))}
function addTask(){
  const title=taskInput.value.trim();
  if(!title){taskInput.focus();return}
  tasks.unshift({id:Date.now(),title,priority:priorityInput.value,dueDate:dueDateInput.value,completed:false});
  saveTasks();renderTasks();
  taskInput.value="";dueDateInput.value="";priorityInput.value="medium";taskInput.focus();
}
function toggleTask(id){tasks=tasks.map(t=>t.id===id?{...t,completed:!t.completed}:t);saveTasks();renderTasks()}
function deleteTask(id){tasks=tasks.filter(t=>t.id!==id);saveTasks();renderTasks()}
function editTask(id){
  const task=tasks.find(t=>t.id===id);
  if(!task)return;
  const title=prompt("タスク名を編集",task.title);
  if(title===null)return;
  const trimmed=title.trim();
  if(!trimmed)return;
  task.title=trimmed;
  saveTasks();renderTasks();
}
function formatDate(date){if(!date)return "";const [y,m,d]=date.split("-");return `${y}/${m}/${d}`}
function getPriorityText(p){return ({high:"高",medium:"中",low:"低"})[p]}
function getFilteredTasks(){
  let list=[...tasks];
  if(currentFilter==="active")list=list.filter(t=>!t.completed);
  if(currentFilter==="completed")list=list.filter(t=>t.completed);
  if(searchText)list=list.filter(t=>t.title.toLowerCase().includes(searchText.toLowerCase()));

  const priorityRank={high:0,medium:1,low:2};
  if(sortMode==="oldest")list.sort((a,b)=>a.id-b.id);
  else if(sortMode==="due")list.sort((a,b)=>{
    if(!a.dueDate && !b.dueDate)return b.id-a.id;
    if(!a.dueDate)return 1;
    if(!b.dueDate)return -1;
    return a.dueDate.localeCompare(b.dueDate);
  });
  else if(sortMode==="priority")list.sort((a,b)=>
    priorityRank[a.priority]-priorityRank[b.priority] || b.id-a.id
  );
  else list.sort((a,b)=>b.id-a.id);
  return list;
}
function renderTasks(){
  const filtered=getFilteredTasks();
  taskList.innerHTML="";
  if(!filtered.length){
    taskList.innerHTML=`<div class="empty">${searchText?"検索に一致するタスクはありません":"タスクはありません"}</div>`;
  }
  filtered.forEach(task=>{
    const el=document.createElement("div");
    el.className=`task ${task.completed?"completed":""}`;
    el.innerHTML=`
      <input class="check" type="checkbox" ${task.completed?"checked":""}>
      <div class="task-content">
        <div class="task-title"></div>
        <div class="task-meta">
          <span class="priority ${task.priority}">${getPriorityText(task.priority)}</span>
          ${task.dueDate?`<span>期限: ${formatDate(task.dueDate)}</span>`:""}
        </div>
      </div>
      <button class="edit" title="編集" aria-label="編集">✎</button>
      <button class="delete" title="削除" aria-label="削除">×</button>`;
    el.querySelector(".task-title").textContent=task.title;
    el.querySelector(".check").addEventListener("change",()=>toggleTask(task.id));
    el.querySelector(".edit").addEventListener("click",()=>editTask(task.id));
    el.querySelector(".delete").addEventListener("click",()=>deleteTask(task.id));
    taskList.appendChild(el);
  });
  taskCount.textContent=`${tasks.filter(t=>!t.completed).length}件`;
}
addButton.addEventListener("click",addTask);
taskInput.addEventListener("keydown",e=>{if(e.key==="Enter")addTask()});
document.getElementById("searchInput").addEventListener("input",e=>{
  searchText=e.target.value.trim();renderTasks();
});
document.getElementById("sortSelect").addEventListener("change",e=>{
  sortMode=e.target.value;renderTasks();
});
document.querySelectorAll(".filter").forEach(button=>{
  button.addEventListener("click",()=>{
    document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
    button.classList.add("active");currentFilter=button.dataset.filter;renderTasks();
  });
});
renderTasks();
</script>
</body>
</html>
