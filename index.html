<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f5fb">
<title>My Tasks</title>
<style>
:root{
 --bg:#f4f5fb;--card:#fff;--text:#181922;--muted:#8b8e9a;
 --purple:#665cf2;--purple2:#8178ff;--line:#ececf2;
 --red:#ff5c68;--orange:#f4ad25;--green:#35a866;
}
*{box-sizing:border-box}html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Hiragino Sans",sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;border:0;outline:0}
.app{width:100%;max-width:760px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(105px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 3px 12px}
.greeting small{display:block;color:var(--muted);font-size:13px;font-weight:600;margin-bottom:3px}
.greeting h1{margin:0;font-size:34px;letter-spacing:-1.5px;font-weight:850}
.profile{width:46px;height:46px;border-radius:50%;background:linear-gradient(145deg,#837aff,#5a51df);color:white;display:grid;place-items:center;font-weight:800;box-shadow:0 7px 18px #665cf238}
.summary{margin:8px 0 18px;padding:20px;border-radius:27px;color:white;background:linear-gradient(135deg,#7067fa,#5750dc);box-shadow:0 13px 28px #665cf235}
.summaryRow{display:flex;justify-content:space-between;align-items:center}
.summaryTitle{font-size:16px;font-weight:750}.summaryCount{font-size:28px;font-weight:850}
.summarySub{font-size:12px;opacity:.82;margin-top:2px}
.progress{height:7px;background:#ffffff35;border-radius:99px;margin-top:17px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:#fff;border-radius:99px;transition:.3s}
.search{height:48px;background:#fff;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;gap:9px;padding:0 14px;margin-bottom:15px;box-shadow:0 5px 16px #16192b08}
.search span{font-size:20px;color:#a0a2ac}.search input{width:100%;background:transparent;font-size:14px}.search input::placeholder{color:#a3a5ae}
.filters{display:flex;gap:7px;overflow:auto;margin-bottom:18px;padding:2px}.filters::-webkit-scrollbar{display:none}
.filter{white-space:nowrap;padding:9px 17px;border-radius:99px;background:#e9eaf2;color:#777b86;font-size:13px;font-weight:750}.filter.active{background:var(--text);color:white}
.section{display:flex;justify-content:space-between;align-items:center;padding:0 3px 10px}.section h2{margin:0;font-size:20px}.section span{font-size:12px;color:var(--muted)}
.list{display:grid;gap:11px}
.task{position:relative;display:flex;align-items:center;gap:12px;padding:15px 13px;background:#fff;border:1px solid var(--line);border-radius:21px;box-shadow:0 6px 18px #16192b08}
.task::before{content:"";width:4px;height:36px;border-radius:8px;background:#bbb;flex:none}.task.high::before{background:var(--red)}.task.medium::before{background:var(--orange)}.task.low::before{background:var(--green)}
.check{width:27px;height:27px;border-radius:50%;border:2px solid #cfd1d9;background:white;flex:none;display:grid;place-items:center;color:white}.done .check{background:var(--purple);border-color:var(--purple)}.done .check:after{content:"✓";font-size:15px;font-weight:900}
.body{min-width:0;flex:1}.title{font-size:16px;font-weight:750;line-height:1.25;overflow-wrap:anywhere}.done .title{text-decoration:line-through;color:#a0a2aa}
.meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:11px;color:var(--muted)}.pill{font-size:10px;font-weight:850;padding:4px 7px;border-radius:7px}.pill.high{background:#ffe4e7;color:#e73e50}.pill.medium{background:#fff0cc;color:#c68300}.pill.low{background:#e1f5e9;color:#34874f}
.delete{width:34px;height:34px;border-radius:11px;background:#f6f6f9;color:#a7a9b0;font-size:20px}
.empty{text-align:center;padding:50px 10px;color:var(--muted)}.emptyIcon{font-size:42px;margin-bottom:8px}.empty strong{display:block;color:#555863;margin-bottom:5px}
.fab{position:fixed;right:max(22px,calc((100vw - 720px)/2 + 22px));bottom:83px;width:58px;height:58px;border-radius:20px;background:var(--purple);color:#fff;font-size:29px;box-shadow:0 12px 25px #665cf250;z-index:5}
.bottom{position:fixed;z-index:10;left:50%;bottom:12px;transform:translateX(-50%);width:min(700px,calc(100% - 28px));height:67px;background:#fffdfdcc;backdrop-filter:blur(20px);border:1px solid #e6e6ed;border-radius:23px;box-shadow:0 10px 30px #1719221c;display:flex;padding:5px}
.nav{flex:1;background:transparent;color:#92949d;border-radius:18px;font-size:10px;font-weight:750}.nav b{display:block;font-size:21px;line-height:25px}.nav.active{color:var(--purple);background:#f0efff}
.sheet{position:fixed;inset:0;background:#17192355;z-index:30;display:none;align-items:flex-end}.sheet.show{display:flex}
.panel{width:100%;max-width:760px;margin:auto;background:#fff;border-radius:29px 29px 0 0;padding:13px 20px calc(25px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px #11152b30}
.handle{width:42px;height:5px;background:#d7d8df;border-radius:99px;margin:0 auto 18px}.panel h3{font-size:21px;margin:0 0 16px}.panel input,.panel select{width:100%;height:50px;background:#f7f7fa;border:1px solid var(--line);border-radius:15px;padding:0 14px;margin-bottom:10px}.row{display:flex;gap:9px}.row>*{flex:1}.save{width:100%;height:50px;border-radius:15px;background:var(--purple);color:white;font-weight:800}
@media(min-width:700px){.app{padding-left:24px;padding-right:24px}}
</style>
</head>
<body>
<main class="app">
 <header class="top">
  <div class="greeting"><small id="dateText"></small><h1>My Tasks</h1></div>
  <div class="profile">✓</div>
 </header>

 <section class="summary">
  <div class="summaryRow"><div><div class="summaryTitle">今日の進捗</div><div class="summarySub" id="summarySub">タスクを整理しましょう</div></div><div class="summaryCount" id="summaryCount">0%</div></div>
  <div class="progress"><i id="bar"></i></div>
 </section>

 <div class="search"><span>⌕</span><input id="search" placeholder="タスクを検索…"></div>

 <div class="filters">
  <button class="filter active" data-filter="all">すべて</button>
  <button class="filter" data-filter="active">未完了</button>
  <button class="filter" data-filter="done">完了</button>
 </div>

 <div class="section"><h2 id="sectionTitle">タスク</h2><span id="count">0件</span></div>
 <section class="list" id="list"></section>
</main>

<button class="fab" id="fab">＋</button>

<nav class="bottom">
 <button class="nav active"><b>⌂</b>ホーム</button>
 <button class="nav" id="navAdd"><b>＋</b>追加</button>
 <button class="nav" id="navDone"><b>✓</b>完了</button>
</nav>

<div class="sheet" id="sheet">
 <div class="panel">
  <div class="handle"></div>
  <h3>新しいタスク</h3>
  <input id="title" placeholder="何をする？">
  <div class="row"><select id="priority"><option value="high">🔴 高優先</option><option value="medium" selected>🟡 中優先</option><option value="low">🟢 低優先</option></select><input id="due" type="date"></div>
  <button class="save" id="save">タスクを追加</button>
 </div>
</div>

<script>
const KEY="myTasks";let tasks=JSON.parse(localStorage.getItem(KEY)||"[]"),filter="all",query="";
const $=x=>document.getElementById(x);
$("dateText").textContent=new Intl.DateTimeFormat("ja-JP",{month:"long",day:"numeric",weekday:"short"}).format(new Date());
function persist(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function add(title,priority="medium",dueDate=""){title=title.trim();if(!title)return;tasks.unshift({id:Date.now()+Math.random(),title,priority,dueDate,completed:false});persist();render()}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function render(){
 const total=tasks.length,done=tasks.filter(t=>t.completed).length,pct=total?Math.round(done/total*100):0;
 $("summaryCount").textContent=pct+"%";$("bar").style.width=pct+"%";$("summarySub").textContent=total?`${done}件完了・${total-done}件未完了`:"タスクを追加して始めましょう";
 let visible=tasks.filter(t=>(filter==="all"||filter==="active"&&!t.completed||filter==="done"&&t.completed)&&t.title.toLowerCase().includes(query.toLowerCase()));
 $("count").textContent=visible.length+"件";$("sectionTitle").textContent=filter==="done"?"完了したタスク":filter==="active"?"未完了のタスク":"タスク";
 if(!visible.length){$("list").innerHTML='<div class="empty"><div class="emptyIcon">✨</div><strong>タスクはありません</strong><span>＋ボタンから追加できます</span></div>';return}
 $("list").innerHTML=visible.map(t=>{let label=t.priority==="high"?"高":t.priority==="low"?"低":"中";return `<article class="task ${t.priority} ${t.completed?"done":""}"><button class="check" onclick="toggle('${t.id}')"></button><div class="body"><div class="title">${esc(t.title)}</div><div class="meta"><span class="pill ${t.priority}">${label}優先</span><span>${t.dueDate?"期限 "+t.dueDate:"期限なし"}</span></div></div><button class="delete" onclick="removeTask('${t.id}')">×</button></article>`}).join("");
}
function toggle(id){tasks=tasks.map(t=>String(t.id)===id?{...t,completed:!t.completed}:t);persist();render()}
function removeTask(id){tasks=tasks.filter(t=>String(t.id)!==id);persist();render()}
function openSheet(){$("sheet").classList.add("show");setTimeout(()=>$("title").focus(),100)}
$("fab").onclick=openSheet;$("navAdd").onclick=openSheet;
$("sheet").onclick=e=>{if(e.target===$("sheet"))$("sheet").classList.remove("show")};
$("save").onclick=()=>{add($("title").value,$("priority").value,$("due").value);$("title").value="";$("due").value="";$("sheet").classList.remove("show")};
$("title").addEventListener("keydown",e=>{if(e.key==="Enter")$("save").click()});
$("search").oninput=e=>{query=e.target.value;render()};
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));render()});
$("navDone").onclick=()=>{filter="done";document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x.dataset.filter==="done"));render()};
render();
</script>
</body>
</html>
